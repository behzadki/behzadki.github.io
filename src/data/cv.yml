# RenderCV YAML format — https://docs.rendercv.com/
# Used by the CV page when site.cv.format is 'rendercv'.

cv:
  name: Behzad Karimi
  location: 'Bozeman, MT, USA'
  email: 'behkarimi@gmail.com'
  #website: 'https://behzadki.github.io'
  summary: >-
    Machine learning researcher and engineer with an M.S. in Electrical
    and Computer Engineering from Montana State University. Experienced
    in applied computer vision, deep learning, and the development of
    machine learning pipelines for scientific applications, including
    object detection, data processing, and feedback-driven model
    improvement. Additional experience in technical instruction and
    IT systems engineering.
  social_networks:
    - network: GitHub
      username: behzadki
    - network: LinkedIn
      username: behzadki
  sections:
    education:
      - institution: Montana State University
        area: Electrical and Computer Engineering
        degree: M.S.
        start_date: '2024'
        end_date: '2026'
        location: 'Bozeman, MT, USA'
        highlights:
          - 'GPA: 3.80/4.00'
          - 'Advisor: Prof. Bradley Whitaker'
          - 'Professional paper: Machine Vision–Based Automated Flake Detection with Feedback-Driven Model Improvement'
          - 'Selected coursework: Machine Learning, Mathematics of Machine Learning, Advanced Data Mining, Data Visualization, Machine Learning for Engineering'
      - institution: Ghiaseddin Jamshid Kashani University
        area: Computer Engineering
        degree: B.S.
        end_date: '2009'
        location: 'Iran'
    experience:
      - company: MonArk NSF Quantum Foundry, Montana State University
        position: Research Assistant
        start_date: '2024-01'
        end_date: '2025-08'
        highlights:
          - 'Contributed to an automated machine vision pipeline for detecting flakes in two-dimensional quantum materials'
          - 'Developed tools to convert detector outputs from CSV to COCO-format JSON annotations for dataset regeneration'
          - 'Supported feedback-driven retraining workflows and integration across evolving software environments'
          - 'Used PyTorch-based computer vision models and transfer learning approaches, including DetectoRS'
      - company: Montana State University
        position: Graduate Teaching Assistant — Signals and Systems
        start_date: '2025-08'
        end_date: '2026-05'
      - company: Padzanij
        position: IT Administrator
        start_date: '2017'
        end_date: '2022'
        highlights:
          - 'Installed and maintained networks, servers, workstations, and core IT infrastructure'
          - 'Managed Windows Server, Active Directory, DNS, DHCP, RAID, and system backups'
      - company: Tehran Institute of Technology
        position: Instructor — Python, Networking, and Computer Skills
        start_date: '2012'
        end_date: '2018'
        highlights:
          - 'Delivered Python, Network+, and ICDL instruction and developed hands-on course materials'
    publications:
      - title: 'Machine Vision-Based Automated Flake Detection with Feedback-Driven Model Improvement'
        authors:
          - Behzad Karimi
          - Bradley M. Whitaker
        journal: '2026 Intermountain Engineering, Technology and Computing (IEEE IETC), pp. 1–6'
        date: '2026'
        url: 'https://ieeexplore.ieee.org/abstract/document/11568601'
      - title: 'Sparse-Observation Atmospheric Thermal Forecasting with Physics-Informed Neural Networks for Climate-Aware Digital Twins'
        authors:
          - Tannaz Goodarzvand Chegini
          - Elyas Shivanian
          - Behzad Karimi
          - Faraz Dadgostari
        journal: 'arXiv preprint, arXiv:2609.27290'
        date: '2026-09-23'
        url: 'https://arxiv.org/abs/2609.27290'
    skills:
      - label: Programming
        details: 'Python, C++, SQL, R, MATLAB'
      - label: Machine Learning and Computer Vision
        details: 'PyTorch, TensorFlow, scikit-learn, OpenCV, MMDetection, object detection, transfer learning'
      - label: Data and Development Tools
        details: 'NumPy, pandas, Matplotlib, Git, Docker'


